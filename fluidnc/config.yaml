# VoiceChess gantry - FluidNC v4.0.3 configuration
# =========================================================================
# CRITICAL PARSER RULE: FluidNC's YAML parser does NOT strip trailing
# comments. "key: value   # note" is read as the literal value
# "value   # note" and fails. Comments must be on their own line.
#
# OWNERSHIP: CLAUDE.md assigns this file to Role 4 (hardware). Generated
# from the ESP32 pin table so the Pi-side G-code and the controller derive
# from the SAME numbers. Items marked BLOCKED or VERIFY in the notes at the
# bottom still need hardware sign-off before a powered run.
#
# Upload:  ./fluidterm.sh -> Ctrl-U -> path, then $Bye
# Verify:  read the boot log. Zero [MSG:ERR: lines = parsed clean.
# =========================================================================

name: "VoiceChess Gantry"
board: "ESP32 Dev Module"

stepping:
  engine: RMT
  # 255 = never de-energize. Open-loop steppers with no camera cannot
  # recover lost position, so hold torque between turns.
  idle_ms: 255
  # TB6600 optocoupler inputs need >=5us. 4 is marginal.
  pulse_us: 6
  dir_delay_us: 5
  disable_delay_us: 0

# All four drivers at 1/16 microstepping (S1 OFF, S2 OFF, S3 ON) = 3200
# pulse/rev. MUST MATCH THE PHYSICAL DIP SWITCHES or every distance below
# is wrong by the ratio of the two.

axes:
  shared_stepper_disable_pin: NO_PIN

  # ---------------------------------------------------------------- X ----
  # Two NEMA 23 ganged on one axis (dual rails), driven as motor0/motor1
  # of the same axis so they always step together.
  x:
    # 200 full-steps * 16 / (20T * 2mm GT2) = 80
    steps_per_mm: 80.000
    # 8000 mm/min = 133 mm/s = 200 rev/min on a 20T GT2 pulley -- well
    # inside a NEMA 23's torque band at 24V, and only 10.6k steps/s per
    # motor, nowhere near the RMT engine's ceiling. (The previous 4000 was
    # set in the first commit and never justified; it is the one
    # conservative number in this file that had no stated reason.)
    # THE REAL CEILING IS NOT ELECTRICAL: X and Y have no limit switches
    # and no soft limits, so nothing stops a runaway rapid from hitting the
    # end of the rail. Raise further only once those switches exist.
    max_rate_mm_per_min: 8000.000
    # Low: a standing chess piece topples easily. This, not max_rate, is
    # what caps short moves -- reaching 8000 needs 29.6mm of runway and a
    # square is only 57mm, so most board moves never hit top speed.
    acceleration_mm_per_sec2: 300.000
    # 720mm rail, 5mm margin.
    max_travel_mm: 715.000
    soft_limits: false
    homing:
      cycle: 0
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 1500.000
      settle_ms: 500
    motor0:
      limit_neg_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 4.000
      stepstick:
        # gpio.12 is a strapping pin (flash voltage select). A TB6600
        # wired common-anode pulls it high at boot and the ESP32 enters a
        # permanent boot loop. Moved to gpio.13.
        step_pin: gpio.13
        direction_pin: gpio.14
    motor1:
      limit_neg_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 4.000
      stepstick:
        step_pin: gpio.16
        # May need :low to counter-rotate the second rail. Confirm both
        # motors turn the SAME way before bolting the gantry on.
        direction_pin: gpio.18

  # ---------------------------------------------------------------- Y ----
  y:
    steps_per_mm: 80.000
    # Same reasoning as X above.
    max_rate_mm_per_min: 8000.000
    acceleration_mm_per_sec2: 300.000
    max_travel_mm: 715.000
    soft_limits: false
    homing:
      cycle: 0
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 1500.000
      settle_ms: 500
    motor0:
      limit_neg_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 4.000
      stepstick:
        step_pin: gpio.27
        direction_pin: gpio.26

  # ---------------------------------------------------------------- Z ----
  # NEMA 17 on rack-and-pinion, so steps_per_mm uses the pinion's PITCH
  # CIRCUMFERENCE, not a belt pitch:
  #     steps_per_mm = 200 * 16 / (pi * module * pinion_teeth)
  # Assumes module 1.0, 20-tooth pinion:
  #     pi * 1.0 * 20 = 62.832 mm/rev -> 3200 / 62.832 = 50.930
  # BLOCKED: replace once the actual pinion is known. A wrong value makes
  # every grip either miss the piece or drive the claw into the board.
  #
  # !! NO LIMIT SWITCH, NO HOMING, NO SOFT LIMITS !!
  # Configured switchless ON PURPOSE so the axis can be bench-tested before
  # the switch is wired. Z0 is wherever the carriage happens to sit at
  # power-on -- it is NOT a repeatable datum. Consequences:
  #
  #   * PARK THE CARRIAGE AT THE TOP OF ITS TRAVEL BEFORE POWERING ON.
  #     G0 Z-132 descends 132mm from wherever it starts, not from the top.
  #   * The ONLY thing keeping the claw out of the table is the Pi-side
  #     envelope check in tools/gcode_preview.py plus the planner never
  #     emitting below Z_GRIP. There is no controller-side backstop.
  #   * Jog in small steps for the first powered test: $J=G91 Z-10 F500.
  #
  # To restore the datum once the switch is wired: cycle: 1,
  # soft_limits: true, limit_pos_pin: gpio.17:low:pu.
  z:
    steps_per_mm: 50.930
    # Z moves 250-440mm per piece transferred -- more than XY does -- so
    # this is the single biggest lever on how long a turn takes.
    max_rate_mm_per_min: 2500.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 170.000
    # Soft limits are measured against a homed datum. With no homing there
    # is nothing to measure from, so this MUST stay false while cycle is 0.
    soft_limits: false
    homing:
      # 0 = excluded from $H. The rest of this block is inert but kept so
      # the intended frame stays recorded: homes UP, top of travel becomes
      # Z0, work envelope 0 to -170.
      cycle: 0
      positive_direction: true
      mpos_mm: 0.000
      feed_mm_per_min: 200.000
      seek_mm_per_min: 800.000
      settle_ms: 500
    motor0:
      # Switch belongs at the TOP of travel. Not wired yet.
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 3.000
      stepstick:
        step_pin: gpio.25
        direction_pin: gpio.33

  # ---------------------------------------------------------------- A ----
  # The claw: an SG90 9g micro-servo. NOT a stepper, NOT on a TB6600.
  # Declared as an AXIS (not a spindle) so G0 A<deg> queues in move order
  # with XY/Z for free.
  #
  # FluidNC maps the pulse range linearly across the axis travel, so with
  # max_travel_mm 90:
  #     A0  -> 1000us   claw OPEN   (60mm outer)
  #     A45 -> 1500us   claw CLOSED (45mm inner, gripping a piece)
  #     A90 -> 2000us
  # A0 and A45 are exactly CLAW_OPEN_A / CLAW_CLOSED_A in motion/config.py.
  #
  # THE KEY IS pwm_hz. FluidNC's internal field is _pwm_freq and the wiki
  # prints "pwm_freq", but the parser only accepts pwm_hz -- verified
  # against FluidNC/src/Motors/RcServo.h. Getting this wrong rejects the
  # whole config and boots the stock "Test Drive no I/O" machine, which
  # acks every G-code line while driving nothing.
  #
  # 1000-2000us is a safe subset of the SG90's ~500-2400us full sweep.
  # POWER: an SG90 stalls near 700mA. Feed it from the 5V buck rail, NOT
  # the ESP32's regulator, and share a common ground.
  #
  # This reverts the stepper block from cb8b3f3, which was written on the
  # assumption that the claw was a NEMA 17. It is a servo, and there is no
  # fifth TB6600 for it anyway: X(2) + Y(1) + Z(1) already uses all four.
  # As a stepstick, FluidNC would have fired ~400 narrow 6us STEP pulses at
  # gpio.19 instead of a 50Hz PWM, and the claw would never have gripped.
  a:
    # "mm" reads as DEGREES here. Only the ratio matters to the pulse
    # mapping, so 1.0 keeps A<deg> literal.
    steps_per_mm: 1.000
    # 100 deg/s. A 45deg open/close takes ~0.45s, which the planner's
    # G4 P0.5 dwell covers.
    max_rate_mm_per_min: 6000.000
    acceleration_mm_per_sec2: 1000.000
    max_travel_mm: 90.000
    soft_limits: false
    homing:
      # A servo knows its own position; never homed.
      cycle: 0
      positive_direction: false
      mpos_mm: 0.000
    motor0:
      rc_servo:
        pwm_hz: 50
        output_pin: gpio.19
        min_pulse_us: 1000
        max_pulse_us: 2000

kinematics:
  Cartesian:

# No spindle, no coolant, no probe on this machine.
start:
  # BLOCKED: set true once X and Y have limit switches.
  must_home: false
  deactivate_parking: true
  check_limits: true

# =========================================================================
# KNOWN GAPS - read before the first powered run
# =========================================================================
#
# 1. NOTHING IS HOMED. X and Y have no limit switches, and Z's is not
#    wired yet, so all three axes are cycle: 0. $H therefore has NO axes
#    to home and will error -- `main.py --no-home` is MANDATORY, not just
#    recommended. After every power cycle the controller has no idea where
#    square a1 is, nor how high the claw sits. This is the single largest
#    risk to a working demo.
#
#    Stopgap until wired - after each power-up, once:
#        $J=G91 X10 F1000     (jog until the claw is centred over a1)
#        G10 L20 P1 X0 Y0     (declare that spot as work zero)
#    Prefer G10 L20 over G92: G92 is an offset that survives in ways that
#    surprise you, G10 L20 sets the work coordinate system directly.
#
#    For Z there is no equivalent stopgap - park the carriage at the top
#    of its travel BEFORE powering on. See the warning on the z: block.
#
# 2. TB6600 CURRENT DIPS are set on the drivers, not here. Set at or just
#    BELOW the motor's rated current per phase - above it is the only
#    setting that can physically cook a motor:
#        NEMA 23 @ 2.8A rated -> 2.5A  (S4 OFF, S5 ON,  S6 ON)   X x2, Y
#        NEMA 17 @ 1.5A rated -> 1.5A  (S4 ON,  S5 ON,  S6 OFF)  Z only
#    VERIFY: confirm the NEMA 23s are the 2.8A part, not the 4.2A
#    high-torque one. The TB6600 caps at 3.5A continuous either way.
#    The claw is a servo and has NO driver - do not set DIPs for it.
#
# 3. MICROSTEPPING must be 1/16 on all four drivers (S1 OFF, S2 OFF,
#    S3 ON) to match the steps_per_mm above.
#
# 4. THE CLAW SERVO takes a single signal wire on gpio.19. gpio.23 is now
#    FREE - it was the DIR pin of the stepper claw that never existed.
#    Power the SG90 from the 5V buck rail, not the ESP32.
#
# 5. AVOID on ESP32: gpio 0/2/5/12/15 (strapping), 6-11 (SPI flash),
#    1/3 (UART0 console), 34-39 (input only).
# =========================================================================